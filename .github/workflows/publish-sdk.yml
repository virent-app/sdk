name: Publish SDK

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @virent.app/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up npm staged publishing
        run: npm install --global npm@11.16.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Release tag v${tag_version} does not match @virent.app/sdk@${package_version}." >&2
            exit 1
          fi

      - name: Verify package
        run: |
          pnpm run check-types
          pnpm run test
          pnpm run build
          pnpm run pack:dry-run

      - name: Stage package on npm
        run: npm stage publish --access public --tag latest --provenance
