name: Publish SDK

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @virent.app/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Release tag v${tag_version} does not match @virent.app/sdk@${package_version}." >&2
            exit 1
          fi

      - name: Verify package
        run: |
          bun run check-types
          bun run test
          bun run build
          bun run pack:dry-run

      - name: Stage package on npm
        run: npm stage publish --access public --tag latest --provenance
